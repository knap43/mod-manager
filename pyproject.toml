[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modmanager"
version = "0.1.0"
description = "A native Linux mod manager in the spirit of Mod Organizer 2, with Proton via umu-launcher"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
modmanager = "modmanager.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modmanager = ["ui/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
